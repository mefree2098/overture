AWSTemplateFormatVersion: "2010-09-09"
Description: Overture single-instance EC2 deployment host

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.xlarge
  AppAllowedCidr:
    Type: String
    Default: 0.0.0.0/0

Resources:
  OvertureVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: overture-vpc

  OvertureInternetGateway:
    Type: AWS::EC2::InternetGateway

  OvertureGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref OvertureInternetGateway
      VpcId: !Ref OvertureVpc

  OverturePublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref OvertureVpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: overture-public-subnet

  OvertureRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref OvertureVpc

  OvertureDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: OvertureGatewayAttachment
    Properties:
      RouteTableId: !Ref OvertureRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref OvertureInternetGateway

  OvertureSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref OvertureRouteTable
      SubnetId: !Ref OverturePublicSubnet

  OvertureSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Overture control plane ingress
      VpcId: !Ref OvertureVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AppAllowedCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  OvertureInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  OvertureInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref OvertureInstanceRole

  OvertureInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref OvertureInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref OvertureSecurityGroup
          SubnetId: !Ref OverturePublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 128
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y docker curl
          systemctl enable --now docker
          mkdir -p /opt/overture/runtime
      Tags:
        - Key: Name
          Value: overture-control-plane

  OvertureElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  OvertureElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt OvertureElasticIp.AllocationId
      InstanceId: !Ref OvertureInstance

Outputs:
  InstanceId:
    Value: !Ref OvertureInstance
  PublicIp:
    Value: !Ref OvertureElasticIp
  AppUrl:
    Value: !Sub http://${OvertureElasticIp}:3000
