# Overture ZAP baseline overrides
# These rules are intentionally ignored:
# - 10049: dynamic dashboards and artifact responses are explicitly non-cacheable
# - 10055: Next.js app-router hydration requires inline bootstrap scripts without a nonce pipeline
# - 10099: false positive triggered by Tailwind utility classes such as py-4
10049	IGNORE	(Intentional no-store responses for project and artifact surfaces)
10055	IGNORE	(Framework-required inline bootstrap for Next.js app router)
10099	IGNORE	(False positive from Tailwind utility class names)
